  secretKey: "replace-me"
---
# Source: star-trek-quiz/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: star-trek-quiz-star-trek-quiz-config
  labels:
    app.kubernetes.io/name: star-trek-quiz
    app.kubernetes.io/instance: star-trek-quiz
    app.kubernetes.io/managed-by: Helm

data:
  questionsFile: "/app/star-trek-quiz.json"
  leaderboardFile: "/app/leaderboard.json"
