apiVersion: v1
kind: ServiceAccount
metadata:
  name: application-c
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: application-c-config
data:
  APP_NAME: application-c
  TEAM: team-b
  CLUSTER: k8s-qa
  NAMESPACE: payments-ns
---
apiVersion: v1
kind: Secret
metadata:
  name: application-c-secret
type: Opaque
stringData:
  API_KEY: changeme
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: application-c
spec:
  selector:
    matchLabels:
      app: application-c
  replicas: 1
  template:
    metadata:
      labels:
        app: application-c
    spec:
      serviceAccountName: application-c
      containers:
      - name: color
        image: elevy99927/color:red
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: application-c-config
        - secretRef:
            name: application-c-secret
---
apiVersion: v1
kind: Service
metadata:
  name: application-c
spec:
  selector:
    app: application-c
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: application-c
spec:
  ingressClassName: nginx
  rules:
  - host: application-c.payments-ns.team-b.k8s-qa.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: application-c
            port:
              number: 80
