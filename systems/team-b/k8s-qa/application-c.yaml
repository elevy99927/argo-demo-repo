apiVersion: apps/v1
kind: Deployment
metadata:
  name: application-c
spec:
  selector:
    matchLabels:
      app: application-c
  replicas: 1
  template:
    metadata:
      labels:
        app: application-c
    spec:
      containers:
      - name: color
        image: elevy99927/color:red
        ports:
        - containerPort: 80
