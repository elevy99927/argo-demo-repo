apiVersion: v1
kind: ServiceAccount
metadata:
  name: application-e
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: application-e-config
data:
  APP_NAME: application-e
  TEAM: team-b
  ENV: qa
---
apiVersion: v1
kind: Secret
metadata:
  name: application-e-secret
type: Opaque
stringData:
  API_KEY: changeme
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: application-e
spec:
  selector:
    matchLabels:
      app: application-e
  replicas: 1
  template:
    metadata:
      labels:
        app: application-e
    spec:
      serviceAccountName: application-e
      containers:
      - name: color
        image: elevy99927/color:green
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: application-e-config
        - secretRef:
            name: application-e-secret
---
apiVersion: v1
kind: Service
metadata:
  name: application-e
spec:
  selector:
    app: application-e
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: application-e
spec:
  ingressClassName: nginx
  rules:
  - host: application-e.team-b.qa.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: application-e
            port:
              number: 80
