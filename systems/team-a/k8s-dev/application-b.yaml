apiVersion: apps/v1
kind: Deployment
metadata:
  name: application-b
spec:
  selector:
    matchLabels:
      app: application-b
  replicas: 1
  template:
    metadata:
      labels:
        app: application-b
    spec:
      containers:
      - name: color
        image: elevy99927/color:yellow
        ports:
        - containerPort: 80
